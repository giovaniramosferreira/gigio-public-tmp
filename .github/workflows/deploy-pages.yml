name: Deploy Pages (portfolio-principal + powerbi)
on:
  push:
    branches: [main]
    paths:
      - "apps/portfolio-principal/**"
      - "apps/portfolio-powerbi/**"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R apps/portfolio-principal/. _site/
          mkdir -p _site/PowerBi_Portifolio
          cp -R apps/portfolio-powerbi/. _site/PowerBi_Portifolio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
